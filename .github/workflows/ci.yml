name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mnemosyne
          POSTGRES_USER: mnemosyne
          POSTGRES_PASSWORD: mnemosyne
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnemosyne -d mnemosyne"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://mnemosyne:mnemosyne@localhost:5432/mnemosyne
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Apply migrations to empty PostgreSQL database
        run: python scripts/migrate.py
      - name: Run domain and PostgreSQL integration tests
        run: python -m pytest -q
