[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosyne-lite"
version = "0.1.0"
description = "Provenance-aware memory infrastructure for AI agents"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
