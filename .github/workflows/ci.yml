name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mnemosyne
          POSTGRES_USER: mnemosyne
          POSTGRES_PASSWORD: mnemosyne
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnemosyne -d mnemosyne"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://mnemosyne:mnemosyne@localhost:5432/mnemosyne
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Apply migrations to empty PostgreSQL database
        run: python scripts/migrate.py
      - name: Run domain, HTTP contract, and real PostgreSQL end-to-end tests
        run: python -m pytest -q

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: mnemosyne-ci
      API_PORT: '18000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure disposable database credentials
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+psycopg://mnemosyne:$password@postgres:5432/mnemosyne" >> "$GITHUB_ENV"
      - name: Build runtime images
        run: docker compose build
      - name: Boot fresh stack and wait for API readiness
        run: docker compose up -d --wait --wait-timeout 120
      - name: Verify explicit migration succeeded
        run: |
          docker compose logs migrate
          docker compose exec -T postgres psql -U mnemosyne -d mnemosyne -tAc "SELECT version FROM schema_migrations" | grep -Fx '001_initial.sql'
      - name: Smoke test canonical HTTP flow and terminal-state conflict
        run: python scripts/smoke_http.py seed --base-url http://127.0.0.1:18000 --state "$RUNNER_TEMP/mnemosyne-smoke.json"
      - name: Restart API container
        run: docker compose restart api
      - name: Verify persistence after API restart
        run: python scripts/smoke_http.py verify --base-url http://127.0.0.1:18000 --state "$RUNNER_TEMP/mnemosyne-smoke.json"
      - name: Report stack logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down disposable stack and volume
        if: always()
        run: docker compose down --volumes --remove-orphans
